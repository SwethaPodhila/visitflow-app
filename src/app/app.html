<div class="layout">

  <!-- Common Sidebar -->
  <app-sidebar></app-sidebar>

  <main class="main-content">

    @if (router.url === '/' || router.url === '/dashboard') {

    <!-- Existing Dashboard UI -->
    <app-dashboard-header (openRegisterWizard)="openWizard()">
    </app-dashboard-header>

    <app-summary-cards [visits]="visits">
    </app-summary-cards>

    @if (showWizard) {
    <app-visitor-wizard (visitSubmitted)="addVisit($event)">
    </app-visitor-wizard>
    }

    <app-status-board [visits]="visits" (transitionRequested)="updateVisitState($event.id, $event.nextState)">
    </app-status-board>

    } @else {

    <!-- Visitors / Registration routes -->
    <router-outlet></router-outlet>

    }

  </main>
</div>
