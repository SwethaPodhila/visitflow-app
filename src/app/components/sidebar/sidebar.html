<aside class="sidebar">

    <!-- Brand -->
    <div class="sidebar-brand">
        <div class="brand-logo">
            <span>V</span>
        </div>
        <div class="brand-text">
            <span class="brand-name">VISITFLOW</span>
            <span class="brand-caption">VISITOR MANAGEMENT</span>
        </div>
    </div>

    <!-- Navigation -->
    <div class="nav-section">
        <p class="nav-heading">WORKSPACE</p>

        <nav class="sidebar-nav">

            <button type="button" class="nav-link" [class.active]="router.url === '/' || router.url === '/dashboard'"
                (click)="setNav('dashboard')">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="8" height="8" rx="2" />
                        <rect x="13" y="3" width="8" height="5" rx="2" />
                        <rect x="13" y="10" width="8" height="11" rx="2" />
                        <rect x="3" y="13" width="8" height="8" rx="2" />
                    </svg>
                </span>
                <span>Dashboard</span>
            </button>

            <button type="button" class="nav-link" [class.active]="router.url === '/visitors'"
                (click)="setNav('visitors')">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="10" cy="7" r="4" />
                        <path d="M20 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                </span>
                <span>Visitors</span>
            </button>

            <button type="button" class="nav-link" [class.active]="router.url === '/registration'"
                (click)="setNav('registration')">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z" />
                        <path d="M4 21h16" />
                    </svg>
                </span>
                <span>Registration</span>
            </button>

        </nav>
    </div>

    <!-- Bottom section -->
    <div class="sidebar-bottom">

        <button type="button" class="nav-link settings-link" [class.active]="router.url === '/settings'"
            (click)="setNav('settings')">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="m19.4 15 .1.1a2 2 0 1 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4v.3a2 2 0 1 1-4 0v-.2a2 2 0 0 0-3.4-1.5l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A2 2 0 0 0 1.6 12H1.5a2 2 0 1 1 0-4h.2a2 2 0 0 0 1.4-3.4L3 4.5a2 2 0 1 1 2.8-2.8l.1.1A2 2 0 0 0 9.3.4V.3a2 2 0 1 1 4 0v.2a2 2 0 0 0 3.4 1.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a2 2 0 0 0 1.4 3.4h.2a2 2 0 1 1 0 4h-.2a2 2 0 0 0-1.5 2.9Z" />
                </svg>
            </span>
            <span>Settings</span>
        </button>

        <div class="sidebar-divider"></div>

        <div class="user-chip">
            <div class="user-avatar">FD</div>
            <div class="user-info">
                <span class="user-name">Front Desk</span>
                <span class="user-role">Administrator</span>
            </div>
            <span class="user-menu">•••</span>
        </div>

    </div>
</aside>
